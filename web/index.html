<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sagre Summer '26</title>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── GAM Milano design tokens ───────────────────────── */
    :root {
      --gold:       #8B7854;   /* museum header gold */
      --gold-light: #A89468;
      --gold-bg:    #F5F0E8;   /* warm tinted page bg */
      --red:        #d6012e;   /* primary CTA */
      --red-hover:  #bc0128;
      --red-light:  #ffbdcb;
      --dark:       #272833;
      --gray-900:   #393a4a;
      --gray-700:   #495057;
      --gray-600:   #6b6c7e;
      --gray-400:   #cdced9;
      --gray-300:   #e7e7ed;
      --gray-200:   #f1f2f5;
      --gray-100:   #f7f8f9;
      --white:      #ffffff;
      --r:          0.25rem;
    }

    /* LLM: swap header gold → navy */
    html.theme-llm .screen-hdr  { background: #2e5aac; }
    html.theme-llm .cal-hdr     { background: #2e5aac; }
    html.theme-llm .llm-tag     { display: inline-flex; }

    .llm-tag {
      display: none; align-items: center; gap: 4px;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.3);
      padding: 1px 8px; margin-top: 6px;
      font-size: .58rem; font-weight: 700; letter-spacing: .1em;
      color: rgba(255,255,255,.85); text-transform: uppercase;
    }

    /* ── New-event golden border ──────────────────────── */
    .is-new-item { border-left-color: #C9A227 !important; }
    .is-new-cal  { box-shadow: inset 0 0 0 2px #C9A227 !important; }

    /* ── Pull-to-refresh bar ─────────────────────────── */
    .pull-bar {
      height: 0; overflow: hidden; flex-shrink: 0;
      background: var(--gold-bg); border-bottom: 1px solid var(--gold-light);
      display: flex; align-items: center; justify-content: center;
      transition: height .18s ease;
    }
    .pull-bar.pulling, .pull-bar.loading { height: 46px; }
    .pull-bar-inner {
      display: flex; align-items: center; gap: 8px;
      font-size: .72rem; font-weight: 700; color: var(--gold);
      letter-spacing: .04em;
    }
    .pull-spinner { font-size: 1rem; display: inline-block; line-height: 1; }
    .pull-bar.loading .pull-spinner { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast notification ──────────────────────────── */
    .toast {
      position: fixed; bottom: 76px; left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--dark); color: var(--white);
      padding: 9px 20px; border-radius: 50rem;
      font-size: .8rem; font-weight: 600; letter-spacing: .02em;
      opacity: 0; transition: opacity .22s, transform .22s;
      pointer-events: none; white-space: nowrap; z-index: 200;
      max-width: 300px; text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,.28);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Layout ───────────────────────────────────────── */
    html, body { height: 100%; }
    body {
      background: var(--gray-200);
      font-family: 'Titillium Web', Helvetica, Arial, sans-serif;
      font-size: 1rem; font-weight: 400; line-height: 1.5;
      color: var(--dark);
      -webkit-font-smoothing: antialiased;
      display: flex; justify-content: center;
    }
    .app {
      width: 100%; max-width: 430px;
      height: 100dvh;
      background: var(--white);
      box-shadow: 0 0 30px rgba(0,0,0,.15);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* ── Views ────────────────────────────────────────── */
    .view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .view.active { display: flex; }
    .view.fade-in { animation: fadeIn .15s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* ── Swipe position dots ─────────────────────────── */
    .swipe-dots {
      display: flex; justify-content: center; gap: 5px;
      padding: 4px 0; flex-shrink: 0;
      background: var(--gold); border-bottom: 1px solid rgba(0,0,0,.1);
    }
    .swipe-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255,255,255,.35);
    }
    .swipe-dot.on { background: var(--white); }

    /* ── Shared screen header ────────────────────────── */
    .screen-hdr {
      background: var(--gold);
      color: var(--white);
      padding: 44px 18px 14px;
      flex-shrink: 0;
    }
    .screen-hdr .app-title {
      font-size: 1.1rem; font-weight: 700;
      letter-spacing: .03em; line-height: 1.2;
    }
    .screen-hdr .screen-sub {
      font-size: .68rem; font-weight: 600;
      letter-spacing: .12em; text-transform: uppercase;
      opacity: .7; margin-top: 3px;
    }

    /* ════════════════════════════════════════════════════
       AGENDA VIEW
    ═════════════════════════════════════════════════════ */
    .agenda-body { flex: 1; overflow-y: auto; }

    /* GAM-style section label with left gold bar */
    .section-label {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 18px 8px;
      font-size: .72rem; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      color: var(--dark);
      border-bottom: 1px solid var(--gray-300);
    }
    .section-label::before {
      content: ''; width: 4px; height: 18px;
      background: var(--gold); flex-shrink: 0;
    }
    .section-label.red::before { background: var(--red); }

    .agenda-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 18px;
      border-bottom: 1px solid var(--gray-300);
      cursor: pointer; transition: background .1s;
      border-left: 4px solid transparent;
      background: var(--white);
    }
    .agenda-item:hover { background: var(--gray-100); }

    .date-badge {
      width: 42px; height: 42px;
      border-radius: var(--r);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .date-badge.saved { background: var(--red); color: var(--white); }
    .date-badge.new-b { background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold-light); }
    .date-badge .db-day { font-size: 15px; font-weight: 700; line-height: 1; }
    .date-badge .db-mon { font-size: 7px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }

    .agenda-info { flex: 1; min-width: 0; }
    .agenda-name { font-size: .9rem; font-weight: 600; color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .agenda-loc  { font-size: .72rem; color: var(--gray-600); margin-top: 1px; }
    .agenda-dot  { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* GAM-style diary shortcut strip */
    .diary-strip {
      background: var(--gold-bg);
      border-top: 2px solid var(--gold);
      padding: 11px 18px;
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; flex-shrink: 0; transition: background .1s;
    }
    .diary-strip:hover { background: #EDE6D8; }
    .diary-strip-ico { font-size: 1.05rem; }
    .diary-strip-lbl { font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
    .diary-strip-cnt { font-size: .62rem; color: var(--gray-600); }

    /* ════════════════════════════════════════════════════
       CALENDAR VIEW
    ═════════════════════════════════════════════════════ */
    .cal-hdr {
      background: var(--gold);
      color: var(--white);
      padding: 44px 18px 12px;
      display: flex; align-items: flex-end; justify-content: space-between;
      flex-shrink: 0;
    }
    .cal-month-title { font-size: 1.15rem; font-weight: 700; letter-spacing: .02em; }
    .cal-nav-btn {
      background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4);
      color: var(--white); width: 30px; height: 30px;
      border-radius: var(--r); font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .1s;
    }
    .cal-nav-btn:hover { background: rgba(255,255,255,.32); }

    .cal-grid-wrap { padding: 8px 14px 4px; flex-shrink: 0; border-bottom: 1px solid var(--gray-300); }
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
    .cal-wd { font-size: .58rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gray-600); text-align: center; padding: 4px 0; }
    .cal-day {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-size: .78rem; font-weight: 400; color: var(--dark);
      border-radius: var(--r); cursor: pointer; transition: background .1s;
    }
    .cal-day:hover:not(.other-month) { background: var(--gray-200); }
    .cal-day.other-month { opacity: .2; pointer-events: none; }
    .cal-day.ev-blue   { background: var(--gold-bg); color: var(--gold); font-weight: 600; }
    .cal-day.ev-orange { background: #ffe5eb; color: var(--red); font-weight: 700; }
    .cal-day.is-today  { background: var(--red); color: var(--white); font-weight: 700; border-radius: 50%; }
    .cal-day.is-sel:not(.is-today) { background: var(--gray-200); outline: 2px solid var(--gold); outline-offset: -2px; font-weight: 700; }

    .cal-popup-wrap { padding: 8px 14px 4px; flex-shrink: 0; }
    .cal-popup {
      background: var(--white); padding: 12px 14px;
      border: 1px solid var(--gray-300);
      border-left: 4px solid var(--red);
      border-radius: var(--r);
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }
    .cal-popup-title { font-size: .9rem; font-weight: 700; color: var(--dark); }
    .cal-popup-sub   { font-size: .72rem; color: var(--gray-600); margin-top: 3px; }
    .cal-popup-tags  { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
    .cal-popup-tag   { font-size: .62rem; font-weight: 700; padding: 2px 8px; border-radius: 50rem; background: var(--gray-200); color: var(--gray-700); text-transform: uppercase; letter-spacing: .04em; }
    .cal-popup-tag.red { background: var(--red); color: var(--white); }
    .cal-popup-link  { margin-top: 8px; font-size: .72rem; font-weight: 700; color: var(--red); cursor: pointer; letter-spacing: .04em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 3px; transition: color .1s; }
    .cal-popup-link:hover { color: var(--red-hover); }

    .cal-legend {
      display: flex; gap: 14px; padding: 5px 14px 6px; flex-shrink: 0;
      border-bottom: 1px solid var(--gray-300);
    }
    .cal-legend-item { display: flex; align-items: center; gap: 5px; font-size: .62rem; font-weight: 600; color: var(--gray-600); letter-spacing: .04em; text-transform: uppercase; }
    .cal-legend-dot  { width: 10px; height: 10px; border-radius: 2px; }

    .cal-scroll { flex: 1; overflow-y: auto; }
    .cal-day-events { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 8px; }

    .cal-ev-card {
      background: var(--white); padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
      cursor: pointer;
      border: 1px solid var(--gray-300);
      border-left: 4px solid var(--red);
      border-radius: var(--r);
      transition: background .1s, box-shadow .1s;
    }
    .cal-ev-card:hover { background: var(--gray-100); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .cal-ev-card.new-ev { border-left-color: var(--gold); }
    .cal-ev-name { font-size: .84rem; font-weight: 600; color: var(--dark); }
    .cal-ev-loc  { font-size: .68rem; color: var(--gray-600); margin-top: 2px; }

    /* ════════════════════════════════════════════════════
       EVENT DETAIL VIEW
    ═════════════════════════════════════════════════════ */
    #view-detail { background: var(--white); }

    .detail-back {
      background: var(--gold);
      padding: 44px 18px 12px;
      font-size: .7rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: rgba(255,255,255,.85);
      cursor: pointer; display: flex; align-items: center; gap: 5px;
      flex-shrink: 0;
    }

    .detail-img {
      height: 180px; flex-shrink: 0; position: relative;
      background: linear-gradient(160deg, var(--gold) 0%, #5A4A30 100%);
      display: flex; align-items: flex-end; padding: 14px 18px;
    }
    .detail-img::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 45%, rgba(0,0,0,.45));
    }
    .detail-img-emoji {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-65%); font-size: 54px; opacity: .4;
    }
    .detail-img-lbl {
      position: relative; z-index: 1;
      font-size: .6rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.6);
    }

    .detail-scroll { flex: 1; overflow-y: auto; }
    .detail-body { padding: 18px 18px 28px; }

    .detail-title {
      font-size: 1.35rem; font-weight: 700;
      color: var(--dark); line-height: 1.2;
    }
    .detail-meta {
      font-size: .78rem; color: var(--gray-600);
      margin-top: 10px; line-height: 1.85;
      border-left: 4px solid var(--gold);
      padding-left: 10px;
    }
    .detail-meta a { color: var(--red); }
    .detail-desc {
      font-size: .88rem; font-weight: 300; color: var(--gray-700);
      margin-top: 14px; line-height: 1.65;
      padding-top: 14px;
      border-top: 1px solid var(--gray-300);
    }
    .detail-tags { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
    .detail-tag { font-size: .62rem; font-weight: 700; padding: 3px 10px; border-radius: 50rem; text-transform: uppercase; letter-spacing: .05em; }
    .detail-tag.food { background: var(--gold-bg); color: var(--gold); }
    .detail-tag.type { background: var(--gray-200); color: var(--gray-700); }
    .detail-tag.auth { background: var(--red); color: var(--white); }

    .detail-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
    .btn-save {
      background: var(--red); color: var(--white);
      border: 1px solid var(--red); border-radius: var(--r);
      padding: 12px 18px; font-family: inherit;
      font-size: .88rem; font-weight: 700; text-align: center;
      cursor: pointer; letter-spacing: .06em; text-transform: uppercase;
      transition: background .15s, border-color .15s;
    }
    .btn-save:hover { background: var(--red-hover); border-color: var(--red-hover); }
    .btn-save.saved { background: var(--white); color: var(--gray-600); border-color: var(--gray-400); }
    .btn-save.saved:hover { background: var(--gray-100); }
    .btn-diary-add {
      background: var(--white); color: var(--gray-600);
      border: 1px solid var(--gray-400); border-radius: var(--r);
      padding: 12px 18px; font-family: inherit;
      font-size: .85rem; font-weight: 600; text-align: center;
      cursor: pointer; letter-spacing: .05em; text-transform: uppercase;
      transition: all .15s;
    }
    .btn-diary-add:hover { background: var(--gray-100); color: var(--dark); border-color: var(--gray-600); }
    .btn-diary-add.in-diary { background: var(--gray-100); color: var(--gray-600); border-color: var(--gray-300); cursor: default; }

    /* ════════════════════════════════════════════════════
       DIARY VIEW
    ═════════════════════════════════════════════════════ */
    #view-diary { background: var(--white); }

    .diary-hdr {
      background: var(--dark); color: var(--white);
      padding: 44px 18px 14px; flex-shrink: 0;
      border-bottom: 3px solid var(--gold);
    }
    .diary-hdr-title { font-size: 1.15rem; font-weight: 700; letter-spacing: .02em; }
    .diary-hdr-sub   { font-size: .65rem; font-weight: 600; opacity: .45; margin-top: 3px; letter-spacing: .08em; text-transform: uppercase; }

    .diary-scroll { flex: 1; overflow-y: auto; background: var(--white); }

    .diary-row {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 18px; border-bottom: 1px solid var(--gray-300);
      cursor: pointer; transition: background .1s; background: var(--white);
    }
    .diary-row:hover { background: var(--gray-100); }
    .diary-thumb {
      width: 50px; height: 50px; border-radius: var(--r);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 22px; background: var(--gold-bg); border: 1px solid var(--gold-light);
    }
    .diary-row-info  { flex: 1; }
    .diary-row-name  { font-size: .88rem; font-weight: 700; color: var(--dark); }
    .diary-row-date  { font-size: .7rem; color: var(--gray-600); margin-top: 2px; }
    .diary-row-stars { font-size: .78rem; color: var(--gold); margin-top: 2px; letter-spacing: 1px; }

    /* Diary open entry */
    .diary-entry-back {
      background: var(--dark); color: var(--gold-light);
      padding: 44px 18px 12px;
      font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      cursor: pointer; display: flex; align-items: center; gap: 4px;
      flex-shrink: 0; border-bottom: 3px solid var(--gold);
    }
    .diary-entry-img {
      height: 110px; flex-shrink: 0;
      background: linear-gradient(100deg, var(--gold-bg) 0%, var(--gold-light) 60%, var(--gold) 100%);
      position: relative; display: flex; align-items: flex-end; padding: 10px 18px;
      border-bottom: 2px solid var(--gold);
    }
    .diary-entry-img-emoji {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-65%); font-size: 40px; opacity: .35;
    }
    .diary-entry-img-lbl { font-size: .68rem; font-weight: 700; color: var(--dark); letter-spacing: .06em; text-transform: uppercase; position: relative; }

    .diary-entry-body { flex: 1; overflow-y: auto; padding: 16px 18px 28px; }

    .diary-stars-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .star-btn { font-size: 1.5rem; cursor: pointer; opacity: .2; transition: opacity .1s; user-select: none; color: var(--gold); }
    .star-btn.on { opacity: 1; }

    .field-label {
      font-size: .62rem; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--gray-600); margin-bottom: 6px;
    }
    .diary-textarea {
      width: 100%; min-height: 90px;
      border: 1px solid var(--gray-400); border-radius: var(--r);
      padding: 10px 12px; font-family: inherit;
      font-size: .88rem; color: var(--dark); background: var(--white);
      resize: vertical; line-height: 1.55; margin-bottom: 18px;
    }
    .diary-textarea:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px var(--red-light); }

    .diary-photo-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .diary-photo-cell {
      aspect-ratio: 1; border-radius: var(--r);
      background: var(--gray-100); border: 1px dashed var(--gray-400);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; color: var(--gray-600); cursor: pointer;
      font-weight: 700; transition: background .1s;
    }
    .diary-photo-cell:hover { background: var(--gray-200); color: var(--dark); }

    /* ════════════════════════════════════════════════════
       BOTTOM NAV
    ═════════════════════════════════════════════════════ */
    .btm-nav {
      flex-shrink: 0; background: var(--white);
      border-top: 2px solid var(--gray-300);
      padding: 6px 0 env(safe-area-inset-bottom, 8px);
      display: flex; justify-content: space-around;
      position: relative;
    }
    .nav-btn {
      background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; padding: 5px 20px;
      color: var(--gray-600); font-family: inherit;
      font-size: .56rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      transition: color .12s; position: relative;
    }
    .nav-btn.active { color: var(--red); }
    .nav-btn.active::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; background: var(--red);
    }
    .nav-ico { font-size: 1.15rem; line-height: 1; }
    .nav-badge {
      position: absolute; top: 2px; right: 12px;
      background: var(--red); color: var(--white);
      font-size: .46rem; font-weight: 700;
      width: 14px; height: 14px; border-radius: 50%;
      display: none; align-items: center; justify-content: center;
    }
    .nav-badge.show { display: flex; }
    .last-update {
      position: absolute; bottom: env(safe-area-inset-bottom, 2px); right: 10px;
      font-size: .46rem; color: var(--gray-600); white-space: nowrap;
      pointer-events: none;
    }
    .app-title {
      cursor: pointer; user-select: none;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .app-title:active { opacity: .75; }

    /* ── Empty state ──────────────────────────────────── */
    .empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; padding: 60px 28px; text-align: center;
      color: var(--gray-600);
    }
    .empty-ico   { font-size: 2.4rem; }
    .empty-title { font-size: .95rem; font-weight: 700; color: var(--gray-700); }
    .empty-sub   { font-size: .82rem; line-height: 1.5; font-weight: 300; }
    .btn-go {
      margin-top: 8px; padding: 10px 24px;
      background: var(--red); color: var(--white);
      border: 1px solid var(--red); border-radius: var(--r);
      font-family: inherit; font-size: .82rem; font-weight: 700;
      cursor: pointer; letter-spacing: .06em; text-transform: uppercase;
      transition: background .15s;
    }
    .btn-go:hover { background: var(--red-hover); }
  </style>
</head>
<body>
<div class="app">

  <!-- ═══════════════ AGENDA ═══════════════ -->
  <div id="view-agenda" class="view active">
    <div class="screen-hdr">
      <div class="app-title" id="app-title">Sagre Summer '26 <span id="title-spinner" style="font-size:.75em;opacity:.55;display:none;">↻</span></div>
      <div class="screen-sub">Estate · Prossimi eventi</div>
      <div class="llm-tag">✦ AI-enhanced</div>
    </div>
    <div class="swipe-dots">
      <div class="swipe-dot on" id="dot-0"></div>
      <div class="swipe-dot" id="dot-1"></div>
      <div class="swipe-dot" id="dot-2"></div>
    </div>
    <div id="pull-bar" class="pull-bar">
      <div class="pull-bar-inner">
        <span class="pull-spinner" id="pull-spinner">↻</span>
        <span id="pull-text">Tira per aggiornare</span>
      </div>
    </div>
    <div id="agenda-body" class="agenda-body" style="flex:1;overflow-y:auto;"></div>
    <div class="diary-strip" id="diary-strip-btn">
      <div class="diary-strip-ico">📓</div>
      <div>
        <div class="diary-strip-lbl">Il mio diario</div>
        <div class="diary-strip-cnt" id="diary-strip-cnt"></div>
      </div>
    </div>
  </div>

  <!-- ═══════════════ CALENDAR ═══════════════ -->
  <div id="view-cal" class="view">
    <div class="cal-hdr">
      <button class="cal-nav-btn" id="cal-prev">‹</button>
      <div class="cal-month-title" id="cal-title"></div>
      <button class="cal-nav-btn" id="cal-next">›</button>
    </div>
    <div class="swipe-dots">
      <div class="swipe-dot" id="dot-0b"></div>
      <div class="swipe-dot on" id="dot-1b"></div>
      <div class="swipe-dot" id="dot-2b"></div>
    </div>
    <div class="cal-grid-wrap">
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div class="cal-popup-wrap" id="cal-popup"></div>
    <div class="cal-legend">
      <div class="cal-legend-item">
        <div class="cal-legend-dot" style="background:var(--gold-bg);border:1px solid var(--gold-light)"></div>Nuovo evento
      </div>
      <div class="cal-legend-item">
        <div class="cal-legend-dot" style="background:#ffe5eb;border:1px solid #ffbdcb"></div>Salvato
      </div>
      <div class="cal-legend-item" style="margin-left:auto;font-size:.55rem;color:var(--gray-600)">↕ cambia mese</div>
    </div>
    <div class="cal-scroll">
      <div id="cal-day-events" class="cal-day-events"></div>
    </div>
  </div>

  <!-- ═══════════════ DETAIL ═══════════════ -->
  <div id="view-detail" class="view">
    <div class="detail-back" id="detail-back">← Indietro</div>
    <div class="detail-scroll">
      <div id="detail-content"></div>
    </div>
  </div>

  <!-- ═══════════════ DIARY ═══════════════ -->
  <div id="view-diary" class="view">
    <div id="diary-hdr-wrap">
      <div class="diary-hdr">
        <div class="diary-hdr-title">My Diary</div>
        <div class="diary-hdr-sub" id="diary-hdr-sub"></div>
      </div>
    </div>
    <div class="swipe-dots">
      <div class="swipe-dot" id="dot-0c"></div>
      <div class="swipe-dot" id="dot-1c"></div>
      <div class="swipe-dot on" id="dot-2c"></div>
    </div>
    <div class="diary-scroll" id="diary-body"></div>
  </div>

  <!-- ═══════════════ BOTTOM NAV ═══════════════ -->
  <nav class="btm-nav">
    <span class="last-update" id="last-update"></span>
    <button class="nav-btn active" id="nav-agenda">
      <div class="nav-ico">☰</div>Agenda
      <span class="nav-badge" id="cand-badge"></span>
    </button>
    <button class="nav-btn" id="nav-cal">
      <div class="nav-ico">◫</div>Calendario
    </button>
    <button class="nav-btn" id="nav-diary">
      <div class="nav-ico">📓</div>Diario
    </button>
  </nav>

</div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
