<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sagre Summer '26</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens ──────────────────────────────────── */
    :root {
      --cream:        oklch(96% 0.012 65);
      --cream-dark:   oklch(91% 0.018 60);
      --terra:        #8B2500;
      --terra-mid:    oklch(52% 0.13 32);
      --terra-light:  oklch(82% 0.09 42);
      --amber:        oklch(78% 0.14 65);
      --amber-bg:     oklch(90% 0.10 52);
      --amber-light:  oklch(93% 0.07 65);
      --blue:         oklch(72% 0.11 215);
      --blue-light:   oklch(88% 0.07 215);
      --blue-text:    oklch(38% 0.12 215);
      --dark:         oklch(18% 0.02 30);
      --mid:          oklch(45% 0.02 30);
      --mid-soft:     oklch(68% 0.015 30);
      --white:        #FFFFFF;
      --r:            14px;
    }

    /* ── LLM subtle indicator (adds a tag, no palette change) */
    .llm-tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,.15);
      border-radius: 20px; padding: 2px 8px;
      font-size: .6rem; font-weight: 600; letter-spacing: .05em;
      color: rgba(255,255,255,.8); margin-top: 4px;
    }
    html:not(.theme-llm) .llm-tag { display: none; }

    /* ── New-event golden border ──────────────────────────── */
    .is-new-item  { border-left: 3px solid #C9A227 !important; }
    .is-new-cal   { box-shadow: inset 0 0 0 1.5px #C9A227 !important; }

    /* ── Layout ────────────────────────────────────────────── */
    html, body { height: 100%; }
    body {
      background: var(--dark);
      font-family: 'DM Sans', system-ui, sans-serif;
      display: flex; justify-content: center;
    }

    .app {
      width: 100%; max-width: 430px;
      height: 100dvh;
      background: var(--cream);
      box-shadow: 0 0 60px rgba(0,0,0,.5);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* ── Views ──────────────────────────────────────────────── */
    .view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .view.active { display: flex; }

    /* ════════════════════════════════════════════════════════
       AGENDA VIEW
    ═════════════════════════════════════════════════════════ */
    .agenda-hdr {
      background: var(--terra);
      color: var(--cream);
      padding: 48px 20px 14px;
      flex-shrink: 0;
    }
    .app-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem; font-weight: 900; letter-spacing: .02em;
    }
    .screen-sub {
      font-size: .68rem; font-weight: 500;
      letter-spacing: .1em; text-transform: uppercase;
      opacity: .65; margin-top: 2px;
    }

    .agenda-body { flex: 1; overflow-y: auto; }

    .section-label {
      font-size: .58rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--mid-soft); padding: 14px 20px 6px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-label::after { content:''; flex:1; height:1px; background: oklch(88% 0.012 65); }

    .agenda-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 20px;
      border-bottom: 1px solid oklch(92% 0.01 65);
      cursor: pointer; transition: background .12s;
      border-left: 3px solid transparent;
    }
    .agenda-item:hover { background: oklch(94% 0.012 65); }

    .date-badge {
      width: 40px; height: 40px;
      background: var(--amber);
      border-radius: 10px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .date-badge.new-badge { background: var(--blue-light); }
    .date-badge .db-day { font-size: 14px; font-weight: 700; color: var(--dark); line-height: 1; }
    .date-badge .db-mon { font-size: 7px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dark); opacity: .7; }

    .agenda-info { flex: 1; min-width: 0; }
    .agenda-name { font-size: .9rem; font-weight: 600; color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .agenda-loc  { font-size: .72rem; color: var(--mid); margin-top: 2px; }
    .agenda-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .diary-strip {
      background: var(--cream-dark);
      border-top: 1px solid oklch(86% 0.018 60);
      padding: 12px 20px;
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; flex-shrink: 0;
      transition: background .12s;
    }
    .diary-strip:hover { background: oklch(88% 0.018 60); }
    .diary-strip-ico  { font-size: 1.1rem; }
    .diary-strip-lbl  { font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--terra); }
    .diary-strip-cnt  { font-size: .62rem; color: var(--mid); }

    /* ════════════════════════════════════════════════════════
       CALENDAR VIEW
    ═════════════════════════════════════════════════════════ */
    .cal-hdr {
      background: var(--terra);
      color: var(--cream);
      padding: 48px 20px 12px;
      display: flex; align-items: flex-end; justify-content: space-between;
      flex-shrink: 0;
    }
    .cal-month-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; }
    .cal-nav-btn {
      background: rgba(255,255,255,.18); border: none;
      color: var(--cream); width: 32px; height: 32px;
      border-radius: 50%; font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s;
    }
    .cal-nav-btn:hover { background: rgba(255,255,255,.30); }

    .cal-grid-wrap { padding: 8px 14px 4px; flex-shrink: 0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-wd { font-size: .58rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--mid-soft); text-align: center; padding: 4px 0; }
    .cal-day {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-size: .78rem; font-weight: 500; color: var(--dark);
      border-radius: 6px; cursor: pointer; position: relative;
      transition: background .1s;
    }
    .cal-day:hover:not(.other-month) { background: oklch(90% 0.015 65); }
    .cal-day.other-month { opacity: .2; pointer-events: none; }
    .cal-day.ev-blue   { background: var(--blue-light); color: var(--blue-text); font-weight: 700; }
    .cal-day.ev-orange { background: var(--amber-bg);   color: var(--terra);     font-weight: 700; }
    .cal-day.is-today  { background: var(--terra); color: var(--cream); font-weight: 700; border-radius: 50%; }
    .cal-day.is-sel:not(.is-today) { outline: 2px solid var(--terra); outline-offset: 1px; }

    .cal-popup-wrap { padding: 0 14px 6px; flex-shrink: 0; }
    .cal-popup {
      background: var(--white); border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
    }
    .cal-popup-title { font-size: .88rem; font-weight: 700; color: var(--dark); }
    .cal-popup-sub   { font-size: .72rem; color: var(--mid); margin-top: 3px; }
    .cal-popup-tags  { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .cal-popup-tag   { font-size: .63rem; font-weight: 600; padding: 2px 8px; border-radius: 20px; background: var(--amber-light); color: var(--terra); }
    .cal-popup-tag.blue { background: var(--blue-light); color: var(--blue-text); }
    .cal-popup-link  { margin-top: 8px; font-size: .72rem; font-weight: 600; color: var(--terra); cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }

    .cal-legend {
      display: flex; gap: 16px; padding: 6px 14px 8px; flex-shrink: 0;
    }
    .cal-legend-item { display: flex; align-items: center; gap: 5px; font-size: .64rem; font-weight: 500; color: var(--mid); }
    .cal-legend-dot  { width: 10px; height: 10px; border-radius: 3px; }

    .cal-scroll { flex: 1; overflow-y: auto; }
    .cal-day-events { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 8px; }

    .cal-ev-card {
      background: var(--white); border-radius: 10px;
      padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; border-left: 3px solid var(--amber);
      box-shadow: 0 1px 6px rgba(0,0,0,.06);
    }
    .cal-ev-card.new-ev { border-left-color: var(--blue); }
    .cal-ev-name { font-size: .84rem; font-weight: 600; color: var(--dark); }
    .cal-ev-loc  { font-size: .68rem; color: var(--mid); margin-top: 2px; }

    /* ════════════════════════════════════════════════════════
       EVENT DETAIL VIEW
    ═════════════════════════════════════════════════════════ */
    #view-detail { background: var(--dark); }

    .detail-back {
      padding: 48px 20px 8px;
      font-size: .78rem; font-weight: 600;
      color: var(--terra-light);
      cursor: pointer; display: flex; align-items: center; gap: 4px;
      flex-shrink: 0;
    }

    .detail-img {
      height: 190px; flex-shrink: 0; position: relative;
      background: linear-gradient(160deg, oklch(72% 0.12 55), oklch(60% 0.15 32));
      display: flex; align-items: flex-end; padding: 14px 20px;
    }
    .detail-img::before {
      content:''; position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,.5) 100%);
    }
    .detail-img-emoji {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-65%); font-size: 56px; opacity: .3;
    }
    .detail-img-lbl {
      position: relative; font-size: .62rem; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.55);
    }

    .detail-scroll { flex: 1; overflow-y: auto; }
    .detail-body { padding: 18px 20px 28px; }

    .detail-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.45rem; font-weight: 700;
      color: var(--cream); line-height: 1.2;
    }
    .detail-meta {
      font-size: .78rem; color: oklch(60% 0.02 30);
      margin-top: 10px; line-height: 1.85;
    }
    .detail-meta a { color: var(--terra-light); text-underline-offset: 2px; }
    .detail-desc {
      font-size: .84rem; font-weight: 300;
      color: oklch(72% 0.015 30);
      margin-top: 12px; line-height: 1.65;
    }
    .detail-tags { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
    .detail-tag { font-size: .66rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
    .detail-tag.food { background: oklch(93% 0.06 65); color: oklch(45% 0.12 60); }
    .detail-tag.type { background: var(--blue-light); color: var(--blue-text); }
    .detail-tag.auth { background: oklch(25% 0.02 30); color: var(--amber); }

    .detail-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
    .btn-save {
      background: var(--terra); color: var(--cream);
      border: none; border-radius: 10px; padding: 13px;
      font-size: .88rem; font-weight: 700; text-align: center;
      cursor: pointer; letter-spacing: .04em; transition: background .15s;
    }
    .btn-save:hover { background: var(--terra-mid); }
    .btn-save.saved { background: oklch(28% 0.02 30); color: oklch(60% 0.02 30); }
    .btn-diary-add {
      background: oklch(24% 0.02 30); color: oklch(65% 0.02 30);
      border: 1px solid oklch(30% 0.02 30);
      border-radius: 10px; padding: 12px;
      font-size: .84rem; font-weight: 600; text-align: center;
      cursor: pointer; transition: all .15s;
    }
    .btn-diary-add:hover { background: oklch(28% 0.02 30); color: var(--cream); }
    .btn-diary-add.in-diary { background: oklch(25% 0.07 140); color: oklch(78% 0.1 140); border-color: oklch(35% 0.1 140); cursor: default; }

    /* ════════════════════════════════════════════════════════
       DIARY VIEW
    ═════════════════════════════════════════════════════════ */
    .diary-hdr {
      background: var(--dark); color: var(--cream);
      padding: 48px 20px 14px; flex-shrink: 0;
    }
    .diary-hdr-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 900; }
    .diary-hdr-sub   { font-size: .66rem; opacity: .45; margin-top: 3px; letter-spacing: .05em; }

    .diary-scroll { flex: 1; overflow-y: auto; background: var(--cream); }

    /* Diary list rows */
    .diary-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 20px;
      border-bottom: 1px solid oklch(92% 0.01 65);
      cursor: pointer; transition: background .12s;
    }
    .diary-row:hover { background: oklch(94% 0.012 65); }
    .diary-thumb {
      width: 50px; height: 50px; border-radius: 10px;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 22px; background: oklch(88% 0.08 55);
    }
    .diary-row-info { flex: 1; }
    .diary-row-name  { font-size: .88rem; font-weight: 700; color: var(--dark); }
    .diary-row-date  { font-size: .7rem; color: var(--mid); margin-top: 2px; }
    .diary-row-stars { font-size: .78rem; color: var(--amber); margin-top: 2px; letter-spacing: 1px; }

    /* Diary open entry */
    .diary-entry-back {
      background: var(--dark); color: var(--terra-light);
      padding: 48px 20px 10px;
      font-size: .78rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 4px;
      flex-shrink: 0;
    }
    .diary-entry-img {
      height: 120px; flex-shrink: 0;
      background: linear-gradient(140deg, oklch(65% 0.1 55), oklch(55% 0.12 32));
      position: relative; display: flex; align-items: flex-end; padding: 10px 16px;
    }
    .diary-entry-img-lbl { font-size: .72rem; font-weight: 600; color: rgba(255,255,255,.75); position: relative; }
    .diary-entry-body { flex: 1; overflow-y: auto; padding: 16px 20px 28px; }

    .diary-stars-row { display: flex; gap: 6px; margin-bottom: 14px; }
    .star-btn { font-size: 1.5rem; cursor: pointer; opacity: .3; transition: opacity .1s; user-select: none; }
    .star-btn.on { opacity: 1; }

    .field-label {
      font-size: .6rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--mid-soft); margin-bottom: 6px;
    }
    .diary-textarea {
      width: 100%; min-height: 90px;
      border: 1px solid oklch(88% 0.012 65); border-radius: 10px;
      padding: 10px 12px; font-family: 'DM Sans', system-ui, sans-serif;
      font-size: .84rem; color: var(--dark); background: var(--white);
      resize: vertical; line-height: 1.55; margin-bottom: 18px;
    }
    .diary-textarea:focus { outline: 2px solid var(--terra); border-color: transparent; }

    .diary-photo-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .diary-photo-cell {
      aspect-ratio: 1; border-radius: 10px;
      background: oklch(92% 0.012 65);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; color: var(--mid-soft);
      border: 2px dashed oklch(84% 0.015 65);
      cursor: pointer; transition: opacity .1s;
    }
    .diary-photo-cell:hover { opacity: .75; }

    /* ── Bottom nav ─────────────────────────────────────── */
    .btm-nav {
      flex-shrink: 0;
      background: var(--white);
      border-top: 1px solid oklch(90% 0.01 65);
      padding: 8px 0 env(safe-area-inset-bottom, 10px);
      display: flex; justify-content: space-around;
    }
    .nav-btn {
      background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; padding: 4px 24px;
      color: var(--mid-soft); font-size: .56rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em; position: relative;
    }
    .nav-btn.active { color: var(--terra); }
    .nav-ico { font-size: 1.2rem; line-height: 1; }
    .nav-badge {
      position: absolute; top: 0; right: 14px;
      background: var(--terra); color: var(--white);
      font-size: .48rem; font-weight: 700;
      width: 14px; height: 14px; border-radius: 50%;
      display: none; align-items: center; justify-content: center;
    }
    .nav-badge.show { display: flex; }
    .last-update {
      position: absolute; bottom: env(safe-area-inset-bottom, 3px); right: 10px;
      font-size: .48rem; color: var(--mid-soft); pointer-events: none; white-space: nowrap;
    }

    /* ── Empty state ──────────────────────────────────────── */
    .empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; padding: 60px 28px; text-align: center;
      color: var(--mid-soft);
    }
    .empty-ico   { font-size: 2.6rem; }
    .empty-title { font-size: .95rem; font-weight: 600; color: var(--mid); }
    .empty-sub   { font-size: .8rem; line-height: 1.5; }
    .btn-go {
      margin-top: 8px; padding: 10px 24px;
      background: var(--terra); color: var(--white);
      border: none; border-radius: 30px;
      font-size: .82rem; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ═══════════════ AGENDA ═══════════════ -->
  <div id="view-agenda" class="view active">
    <div class="agenda-hdr">
      <div class="app-title">Sagre Summer '26</div>
      <div class="screen-sub">Estate · Prossimi eventi</div>
      <div class="llm-tag">✦ AI-enhanced</div>
    </div>
    <div id="agenda-body" class="agenda-body"></div>
    <div class="diary-strip" id="diary-strip-btn">
      <div class="diary-strip-ico">📓</div>
      <div>
        <div class="diary-strip-lbl">Il mio diario</div>
        <div class="diary-strip-cnt" id="diary-strip-cnt"></div>
      </div>
    </div>
  </div>

  <!-- ═══════════════ CALENDAR ═══════════════ -->
  <div id="view-cal" class="view">
    <div class="cal-hdr">
      <button class="cal-nav-btn" id="cal-prev">‹</button>
      <div class="cal-month-title" id="cal-title"></div>
      <button class="cal-nav-btn" id="cal-next">›</button>
    </div>
    <div class="cal-grid-wrap">
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div class="cal-popup-wrap" id="cal-popup"></div>
    <div class="cal-legend">
      <div class="cal-legend-item">
        <div class="cal-legend-dot" style="background:var(--blue-light)"></div>Nuovo evento
      </div>
      <div class="cal-legend-item">
        <div class="cal-legend-dot" style="background:var(--amber-bg)"></div>Salvato
      </div>
    </div>
    <div class="cal-scroll">
      <div id="cal-day-events" class="cal-day-events"></div>
    </div>
  </div>

  <!-- ═══════════════ DETAIL ═══════════════ -->
  <div id="view-detail" class="view">
    <div class="detail-back" id="detail-back">← Indietro</div>
    <div class="detail-scroll">
      <div id="detail-content"></div>
    </div>
  </div>

  <!-- ═══════════════ DIARY ═══════════════ -->
  <div id="view-diary" class="view">
    <div id="diary-hdr-wrap">
      <div class="diary-hdr">
        <div class="diary-hdr-title">My Diary</div>
        <div class="diary-hdr-sub" id="diary-hdr-sub"></div>
      </div>
    </div>
    <div class="diary-scroll" id="diary-body"></div>
  </div>

  <!-- ═══════════════ BOTTOM NAV ═══════════════ -->
  <nav class="btm-nav" style="position:relative">
    <span class="last-update" id="last-update"></span>
    <button class="nav-btn active" id="nav-agenda">
      <div class="nav-ico">☰</div>Agenda
      <span class="nav-badge" id="cand-badge"></span>
    </button>
    <button class="nav-btn" id="nav-cal">
      <div class="nav-ico">◫</div>Calendario
    </button>
    <button class="nav-btn" id="nav-diary">
      <div class="nav-ico">📓</div>Diario
    </button>
  </nav>

</div>
<script src="app.js"></script>
</body>
</html>
