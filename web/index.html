<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sagre Summer '26</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Cubist palette ────────────────────────────────── */
    :root {
      --red:     #C43525;
      --blue:    #1B4B8E;
      --yellow:  #E8A800;
      --white:   #F2EEE4;
      --black:   #1A1A1A;
      --cream:   #EBE4D4;
      --orange:  #D95F1A;
      --mid:     #4A4540;
      --soft:    #8A827A;
      --r:       0px;
    }

    /* LLM: swap agenda header red → blue */
    html.theme-llm .agenda-hdr { background: var(--blue); }
    html.theme-llm .llm-tag    { display: inline-flex; }

    .llm-tag {
      display: none;
      align-items: center; gap: 4px;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.3);
      padding: 1px 8px; margin-top: 5px;
      font-size: .58rem; font-weight: 700; letter-spacing: .08em;
      color: rgba(255,255,255,.85); text-transform: uppercase;
    }

    /* ── New-event golden border ──────────────────────── */
    .is-new-item { border-left: 4px solid #C9A227 !important; }
    .is-new-cal  { outline: 2px solid #C9A227 !important; outline-offset: -2px; }

    /* ── Layout ───────────────────────────────────────── */
    html, body { height: 100%; }
    body {
      background: var(--black);
      font-family: 'DM Sans', system-ui, sans-serif;
      display: flex; justify-content: center;
    }
    .app {
      width: 100%; max-width: 430px;
      height: 100dvh;
      background: var(--white);
      border-left: 3px solid var(--black);
      border-right: 3px solid var(--black);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* ── Views ────────────────────────────────────────── */
    .view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .view.active { display: flex; }
    .view.fade-in { animation: fadeIn .18s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ════════════════════════════════════════════════════
       AGENDA
    ═════════════════════════════════════════════════════ */
    .agenda-hdr {
      background: var(--red);
      color: var(--white);
      padding: 46px 20px 14px;
      border-bottom: 3px solid var(--black);
      flex-shrink: 0;
    }
    .app-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem; font-weight: 900; letter-spacing: .01em;
    }
    .screen-sub {
      font-size: .62rem; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      opacity: .72; margin-top: 3px;
    }

    .agenda-body { flex: 1; overflow-y: auto; }

    /* Cubist section strip */
    .section-strip {
      font-size: .6rem; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      padding: 6px 20px;
      display: flex; align-items: center;
      border-bottom: 2px solid var(--black);
    }
    .section-strip.yellow { background: var(--yellow); color: var(--black); }
    .section-strip.blue   { background: var(--blue);   color: var(--white); }

    .agenda-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 20px;
      border-bottom: 2px solid var(--black);
      cursor: pointer; transition: background .1s;
      border-left: 4px solid transparent;
      background: var(--white);
    }
    .agenda-item:hover { background: var(--cream); }

    .date-badge {
      width: 42px; height: 42px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      flex-shrink: 0;
      border: 2px solid var(--black);
    }
    .date-badge.saved { background: var(--yellow); }
    .date-badge.new-b { background: var(--blue); }
    .date-badge .db-day { font-size: 15px; font-weight: 700; color: var(--black); line-height: 1; }
    .date-badge.new-b .db-day { color: var(--white); }
    .date-badge .db-mon { font-size: 7px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--black); opacity: .7; }
    .date-badge.new-b .db-mon { color: rgba(255,255,255,.7); }

    .agenda-info { flex: 1; min-width: 0; }
    .agenda-name { font-size: .9rem; font-weight: 700; color: var(--black); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .agenda-loc  { font-size: .7rem; color: var(--mid); margin-top: 2px; }
    .agenda-dot  { width: 9px; height: 9px; flex-shrink: 0; }

    .diary-strip {
      background: var(--black);
      padding: 12px 20px;
      display: flex; align-items: center; gap: 12px;
      cursor: pointer; flex-shrink: 0;
      border-top: 3px solid var(--black);
      transition: background .12s;
    }
    .diary-strip:hover { background: #2A2A2A; }
    .diary-strip-ico { font-size: 1.1rem; }
    .diary-strip-lbl { font-size: .62rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--yellow); }
    .diary-strip-cnt { font-size: .62rem; color: rgba(255,255,255,.45); }

    /* ════════════════════════════════════════════════════
       CALENDAR
    ═════════════════════════════════════════════════════ */
    .cal-hdr {
      background: var(--blue);
      color: var(--white);
      padding: 46px 20px 12px;
      display: flex; align-items: flex-end; justify-content: space-between;
      border-bottom: 3px solid var(--black);
      flex-shrink: 0;
    }
    .cal-month-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; }
    .cal-nav-btn {
      background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.4);
      color: var(--white); width: 32px; height: 32px;
      font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .1s;
    }
    .cal-nav-btn:hover { background: rgba(255,255,255,.28); }

    .cal-grid-wrap {
      padding: 8px 14px 2px; flex-shrink: 0;
      border-bottom: 2px solid var(--black);
    }
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      border: 2px solid var(--black); gap: 0;
    }
    .cal-wd {
      font-size: .56rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--white);
      background: var(--black);
      text-align: center; padding: 4px 0;
    }
    .cal-day {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-size: .78rem; font-weight: 600; color: var(--black);
      border: 1px solid rgba(26,26,26,.18);
      cursor: pointer; position: relative;
      transition: background .1s;
    }
    .cal-day:hover:not(.other-month) { background: var(--cream); }
    .cal-day.other-month { opacity: .18; pointer-events: none; }
    .cal-day.ev-blue   { background: var(--blue);   color: var(--white);  font-weight: 700; }
    .cal-day.ev-orange { background: var(--yellow); color: var(--black);  font-weight: 700; }
    .cal-day.is-today  { background: var(--red);    color: var(--white);  font-weight: 700; }
    .cal-day.is-sel:not(.is-today) { background: var(--yellow); color: var(--black); outline: 3px solid var(--black); outline-offset: -3px; }

    .cal-popup-wrap { padding: 8px 14px 4px; flex-shrink: 0; }
    .cal-popup {
      background: var(--white); padding: 12px 14px;
      border: 2.5px solid var(--black);
      box-shadow: 4px 4px 0 var(--black);
    }
    .cal-popup-title { font-size: .9rem; font-weight: 700; color: var(--black); }
    .cal-popup-sub   { font-size: .7rem; color: var(--mid); margin-top: 3px; }
    .cal-popup-tags  { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .cal-popup-tag   { font-size: .62rem; font-weight: 700; padding: 2px 8px; background: var(--yellow); color: var(--black); letter-spacing: .04em; text-transform: uppercase; border: 1.5px solid var(--black); }
    .cal-popup-tag.blue { background: var(--blue); color: var(--white); border-color: var(--black); }
    .cal-popup-link  { margin-top: 8px; font-size: .72rem; font-weight: 700; color: var(--red); cursor: pointer; letter-spacing: .04em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 3px; }

    .cal-legend {
      display: flex; gap: 14px; padding: 6px 14px 6px; flex-shrink: 0;
      border-bottom: 2px solid var(--black);
    }
    .cal-legend-item { display: flex; align-items: center; gap: 5px; font-size: .62rem; font-weight: 700; color: var(--mid); letter-spacing: .04em; text-transform: uppercase; }
    .cal-legend-dot  { width: 12px; height: 12px; border: 1.5px solid var(--black); }

    .cal-scroll { flex: 1; overflow-y: auto; }
    .cal-day-events { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 8px; }

    .cal-ev-card {
      background: var(--white); padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; border: 2px solid var(--black);
      box-shadow: 3px 3px 0 var(--black);
      transition: transform .1s, box-shadow .1s;
      border-left: 5px solid var(--yellow);
    }
    .cal-ev-card:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--black); }
    .cal-ev-card.new-ev { border-left-color: var(--blue); }
    .cal-ev-name { font-size: .84rem; font-weight: 700; color: var(--black); }
    .cal-ev-loc  { font-size: .68rem; color: var(--mid); margin-top: 2px; }

    /* ════════════════════════════════════════════════════
       EVENT DETAIL
    ═════════════════════════════════════════════════════ */
    #view-detail { background: var(--black); }

    .detail-back {
      padding: 46px 20px 10px;
      font-size: .72rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--yellow);
      cursor: pointer; display: flex; align-items: center; gap: 4px;
      flex-shrink: 0; border-bottom: 2px solid rgba(255,255,255,.1);
    }

    .detail-img {
      height: 180px; flex-shrink: 0; position: relative;
      background: linear-gradient(135deg, var(--red) 0% 45%, var(--blue) 45% 70%, var(--yellow) 70% 100%);
      display: flex; align-items: flex-end; padding: 14px 20px;
      border-bottom: 3px solid var(--black);
    }
    .detail-img-emoji {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-65%); font-size: 56px;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.5));
      opacity: .6;
    }
    .detail-img-lbl {
      position: relative; font-size: .58rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.6);
    }

    .detail-scroll { flex: 1; overflow-y: auto; }
    .detail-body { padding: 18px 20px 28px; }

    .detail-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem; font-weight: 700;
      color: var(--white); line-height: 1.15;
    }
    .detail-meta {
      font-size: .78rem; color: rgba(255,255,255,.55);
      margin-top: 10px; line-height: 1.9;
      border-left: 3px solid var(--yellow);
      padding-left: 10px;
    }
    .detail-meta a { color: var(--yellow); }
    .detail-desc {
      font-size: .84rem; font-weight: 300;
      color: rgba(255,255,255,.65);
      margin-top: 14px; line-height: 1.65;
      border-top: 2px solid rgba(255,255,255,.1);
      padding-top: 12px;
    }
    .detail-tags { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
    .detail-tag { font-size: .62rem; font-weight: 700; padding: 3px 10px; letter-spacing: .05em; text-transform: uppercase; border: 1.5px solid; }
    .detail-tag.food { border-color: var(--yellow); color: var(--yellow); }
    .detail-tag.type { border-color: var(--blue);   color: #6EA0E0; background: rgba(27,75,142,.25); }
    .detail-tag.auth { background: var(--yellow);   color: var(--black); border-color: var(--yellow); }

    .detail-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
    .btn-save {
      background: var(--red); color: var(--white);
      border: 2.5px solid var(--white); padding: 13px;
      font-size: .88rem; font-weight: 700; text-align: center;
      cursor: pointer; letter-spacing: .06em; text-transform: uppercase;
      transition: background .12s;
    }
    .btn-save:hover { background: #A02C1E; }
    .btn-save.saved { background: transparent; color: rgba(255,255,255,.45); border-color: rgba(255,255,255,.2); }
    .btn-diary-add {
      background: transparent; color: rgba(255,255,255,.55);
      border: 2px solid rgba(255,255,255,.2); padding: 12px;
      font-size: .82rem; font-weight: 700; text-align: center;
      cursor: pointer; letter-spacing: .05em; text-transform: uppercase;
      transition: all .12s;
    }
    .btn-diary-add:hover { border-color: var(--yellow); color: var(--yellow); }
    .btn-diary-add.in-diary { border-color: #4A8C4A; color: #7EC47E; cursor: default; }

    /* ════════════════════════════════════════════════════
       DIARY
    ═════════════════════════════════════════════════════ */
    .diary-hdr {
      background: var(--black); color: var(--white);
      padding: 46px 20px 14px;
      border-bottom: 3px solid var(--yellow);
      flex-shrink: 0;
    }
    .diary-hdr-title { font-family: 'Playfair Display', serif; font-size: 1.35rem; font-weight: 900; }
    .diary-hdr-sub   { font-size: .62rem; opacity: .4; margin-top: 3px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; }

    .diary-scroll { flex: 1; overflow-y: auto; background: var(--white); }

    .diary-row {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 20px;
      border-bottom: 2px solid var(--black);
      cursor: pointer; transition: background .1s;
      background: var(--white);
    }
    .diary-row:hover { background: var(--cream); }
    .diary-thumb {
      width: 50px; height: 50px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; background: var(--yellow);
      border: 2px solid var(--black);
    }
    .diary-row-info { flex: 1; }
    .diary-row-name  { font-size: .88rem; font-weight: 700; color: var(--black); }
    .diary-row-date  { font-size: .7rem;  color: var(--mid); margin-top: 2px; }
    .diary-row-stars { font-size: .78rem; color: var(--yellow); margin-top: 2px; letter-spacing: 1px; }

    /* Diary open entry */
    .diary-entry-back {
      background: var(--black); color: var(--yellow);
      padding: 46px 20px 10px;
      font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      cursor: pointer; display: flex; align-items: center; gap: 4px;
      flex-shrink: 0; border-bottom: 3px solid var(--yellow);
    }
    .diary-entry-img {
      height: 110px; flex-shrink: 0;
      background: linear-gradient(100deg, var(--yellow) 0% 40%, var(--orange) 40% 70%, var(--red) 70% 100%);
      position: relative; display: flex; align-items: flex-end; padding: 10px 16px;
      border-bottom: 3px solid var(--black);
    }
    .diary-entry-img-lbl { font-size: .7rem; font-weight: 700; color: var(--black); letter-spacing: .06em; text-transform: uppercase; position: relative; }

    .diary-entry-body { flex: 1; overflow-y: auto; padding: 16px 20px 28px; }

    .diary-stars-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .star-btn { font-size: 1.55rem; cursor: pointer; opacity: .25; transition: opacity .1s; user-select: none; color: var(--yellow); }
    .star-btn.on { opacity: 1; }

    .field-label {
      font-size: .58rem; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--mid); margin-bottom: 6px;
    }
    .diary-textarea {
      width: 100%; min-height: 90px;
      border: 2px solid var(--black); padding: 10px 12px;
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: .84rem; color: var(--black); background: var(--white);
      resize: vertical; line-height: 1.55; margin-bottom: 18px;
    }
    .diary-textarea:focus { outline: none; border-color: var(--red); box-shadow: 3px 3px 0 var(--red); }

    .diary-photo-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .diary-photo-cell {
      aspect-ratio: 1; background: var(--cream);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; color: var(--soft);
      border: 2px dashed var(--black);
      cursor: pointer; font-weight: 700; font-size: 1.2rem;
      transition: background .1s;
    }
    .diary-photo-cell:hover { background: var(--cream); color: var(--black); }

    /* ════════════════════════════════════════════════════
       BOTTOM NAV
    ═════════════════════════════════════════════════════ */
    .btm-nav {
      flex-shrink: 0;
      background: var(--white);
      border-top: 3px solid var(--black);
      padding: 6px 0 env(safe-area-inset-bottom, 8px);
      display: flex; justify-content: space-around;
      position: relative;
    }
    .nav-btn {
      background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; padding: 6px 20px;
      color: var(--soft); font-size: .56rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      transition: background .12s, color .12s;
    }
    .nav-btn.active {
      background: var(--yellow);
      color: var(--black);
    }
    .nav-ico { font-size: 1.2rem; line-height: 1; }
    .nav-badge {
      position: absolute; top: 0; right: 10px;
      background: var(--red); color: var(--white);
      font-size: .48rem; font-weight: 700;
      width: 14px; height: 14px;
      display: none; align-items: center; justify-content: center;
    }
    .nav-badge.show { display: flex; }
    .last-update {
      position: absolute; bottom: env(safe-area-inset-bottom, 2px); right: 10px;
      font-size: .46rem; color: var(--soft); pointer-events: none; white-space: nowrap;
    }

    /* ── Empty state ──────────────────────────────────── */
    .empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; padding: 60px 28px; text-align: center;
      color: var(--soft);
    }
    .empty-ico   { font-size: 2.6rem; }
    .empty-title { font-size: .95rem; font-weight: 700; color: var(--mid); }
    .empty-sub   { font-size: .8rem; line-height: 1.5; }
    .btn-go {
      margin-top: 8px; padding: 10px 24px;
      background: var(--red); color: var(--white);
      border: 2px solid var(--black); font-size: .8rem; font-weight: 700;
      cursor: pointer; letter-spacing: .06em; text-transform: uppercase;
    }

    /* ── Swipe hint strip ─────────────────────────────── */
    .swipe-hint {
      display: flex; justify-content: center; gap: 6px;
      padding: 4px 0; flex-shrink: 0;
      border-bottom: 2px solid var(--black);
      background: var(--cream);
    }
    .swipe-dot {
      width: 6px; height: 6px;
      background: rgba(26,26,26,.2);
    }
    .swipe-dot.active { background: var(--red); }
  </style>
</head>
<body>
<div class="app">

  <!-- ═══════════════ AGENDA ═══════════════ -->
  <div id="view-agenda" class="view active">
    <div class="agenda-hdr">
      <div class="app-title">Sagre Summer '26</div>
      <div class="screen-sub">Estate · Prossimi eventi</div>
      <div class="llm-tag">✦ AI-enhanced</div>
    </div>
    <!-- swipe indicator dots -->
    <div class="swipe-hint">
      <div class="swipe-dot active" id="dot-0"></div>
      <div class="swipe-dot" id="dot-1"></div>
      <div class="swipe-dot" id="dot-2"></div>
    </div>
    <div id="agenda-body" class="agenda-body" style="flex:1;overflow-y:auto;"></div>
    <div class="diary-strip" id="diary-strip-btn">
      <div class="diary-strip-ico">📓</div>
      <div>
        <div class="diary-strip-lbl">Il mio diario</div>
        <div class="diary-strip-cnt" id="diary-strip-cnt"></div>
      </div>
    </div>
  </div>

  <!-- ═══════════════ CALENDAR ═══════════════ -->
  <div id="view-cal" class="view">
    <div class="cal-hdr">
      <button class="cal-nav-btn" id="cal-prev">‹</button>
      <div class="cal-month-title" id="cal-title"></div>
      <button class="cal-nav-btn" id="cal-next">›</button>
    </div>
    <div class="swipe-hint">
      <div class="swipe-dot" id="dot-0b"></div>
      <div class="swipe-dot active" id="dot-1b"></div>
      <div class="swipe-dot" id="dot-2b"></div>
    </div>
    <div class="cal-grid-wrap">
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div class="cal-popup-wrap" id="cal-popup"></div>
    <div class="cal-legend">
      <div class="cal-legend-item">
        <div class="cal-legend-dot" style="background:var(--blue)"></div>Nuovo
      </div>
      <div class="cal-legend-item">
        <div class="cal-legend-dot" style="background:var(--yellow)"></div>Salvato
      </div>
      <div class="cal-legend-item" style="font-size:.58rem;color:var(--soft);margin-left:auto">↕ mese</div>
    </div>
    <div class="cal-scroll">
      <div id="cal-day-events" class="cal-day-events"></div>
    </div>
  </div>

  <!-- ═══════════════ DETAIL ═══════════════ -->
  <div id="view-detail" class="view">
    <div class="detail-back" id="detail-back">← Indietro</div>
    <div class="detail-scroll">
      <div id="detail-content"></div>
    </div>
  </div>

  <!-- ═══════════════ DIARY ═══════════════ -->
  <div id="view-diary" class="view">
    <div id="diary-hdr-wrap">
      <div class="diary-hdr">
        <div class="diary-hdr-title">My Diary</div>
        <div class="diary-hdr-sub" id="diary-hdr-sub"></div>
