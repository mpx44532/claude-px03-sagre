name: Web Research – discover sagre URLs

on:
  schedule:
    - cron: "30 1 * * *"   # every night at 01:30 UTC (before scrape.yml at 02:00)
  workflow_dispatch:        # manual trigger

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run web research (Step 1)
        run: python scraper/web_research.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit & push search_urls.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/search_urls.json
          git diff --cached --quiet || git commit -m "chore: update search_urls.json [skip ci]"
          git push
