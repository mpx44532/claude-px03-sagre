name: Pipeline – web research (Claude web_search)

on:
  workflow_dispatch:        # manual trigger only – schedule disabled pending cost review

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run web research (search + extract in one pass)
        run: python scraper/web_research.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit & push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sagre.json data/search_urls.json
          git diff --cached --quiet || git commit -m "chore: update data via web_research [skip ci]"
          git push
